services:
  kodus-web:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-web:${IMAGE_TAG:-latest}
    container_name: kodus-web-prod
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    environment:
      - NODE_ENV=production
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env

  api:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: ${GLOBAL_API_CONTAINER_NAME:-kodus-api}
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    ports:
      - "3001:3001"
    environment:
      - ENV=production
      - NODE_ENV=production
      # Self-hosted defaults off because this exporter persists logs and
      # telemetry in MongoDB. Operators can opt in explicitly from .env.
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-worker:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-worker-prod
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    environment:
      - ENV=production
      - NODE_ENV=production
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
      # Only `api` runs DB migrations on boot — it runs the OLTP *and* the
      # analytics-warehouse migrations from the shared prod-entrypoint. If
      # worker/webhooks/worker-analytics also migrated concurrently they would
      # race on CREATE TYPE (duplicate key pg_type_typname_nsp_index) and
      # crash-loop the first boot. Override the .env default to false here.
      - RUN_MIGRATIONS=false
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Analytics ingestion worker (Enterprise / Cockpit). Same image as `worker`,
  # only WORKER_ROLE differs: this process runs the cockpit warehouse ingestion
  # + PR classifier crons and writes the `analytics` Postgres schema. The main
  # `worker` stays role=code-review and never touches analytics.
  #
  # Opt-in: gated behind the `analytics` compose profile so community installs
  # don't pay for an idle worker. Enable with `COMPOSE_PROFILES=analytics`
  # (and set the ANALYTICS_* block in .env). See docs → Analytics Worker.
  worker-analytics:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-worker:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-worker-analytics
    profiles:
      - analytics
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    environment:
      - ENV=production
      - NODE_ENV=production
      - WORKER_ROLE=analytics
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
      # Migrations belong to `api` only — see the note on the `worker` service.
      - RUN_MIGRATIONS=false
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  webhooks:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-webhook:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-webhooks-prod
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    ports:
      - "${API_WEBHOOKS_PORT:-3332}:${API_WEBHOOKS_PORT:-3332}"
    environment:
      - ENV=production
      - NODE_ENV=production
      - API_WEBHOOKS_PORT=${API_WEBHOOKS_PORT:-3332}
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
      # Migrations belong to `api` only — see the note on the `worker` service.
      - RUN_MIGRATIONS=false
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kodus-mcp-manager:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-mcp-manager:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-mcp-manager
    ports:
      - "${API_MCP_MANAGER_PORT:-3101}:${API_MCP_MANAGER_PORT:-3101}"
    environment:
      - NODE_ENV=${API_MCP_MANAGER_NODE_ENV:-production}
      - API_MCP_MANAGER_NODE_ENV=${API_MCP_MANAGER_NODE_ENV:-production}
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
    env_file:
      - .env
    networks:
      - kodus-backend-services
      - shared-network
    restart: unless-stopped

  rabbitmq:
    # Pre-built image bundling the rabbitmq_delayed_message_exchange plugin
    # (required by Kodus workflow delayed retries — see kodus-ai issue #873).
    # Published by kodus-ai .github/workflows/rabbitmq-build-push.yml: base
    # digest-pinned, plugin/rabbitmqadmin SHA256-verified, Trivy-scanned, and
    # it provisions both the kodus-ai and kodus-ast vhosts. Pinned to a fixed
    # tag rather than :latest because this image tracks the RabbitMQ + plugin
    # version, not the Kodus release. The local docker/rabbitmq/ build context
    # is kept as a fallback but is no longer used.
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-rabbitmq:4.2.2-kodus
    container_name: rabbitmq-prod
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    ports:
      - "5672"
      - "15672"
      - "15692:15692"
    networks:
      - monitoring-network
      - shared-network
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-kodus}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-kodus}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit heartbeat 60
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - rabbitmq-data-prod:/var/lib/rabbitmq
    command: /usr/local/bin/init-definitions.sh
    restart: unless-stopped

  db_kodus_postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: db_kodus_postgres
    ports:
      - "5432"
    environment:
      POSTGRES_USER: ${API_PG_DB_USERNAME}
      POSTGRES_PASSWORD: ${API_PG_DB_PASSWORD}
      POSTGRES_DB: ${API_PG_DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - kodus-backend-services
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${API_PG_DB_USERNAME} -d ${API_PG_DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  db_kodus_mongodb:
    # Pinned, not floating. `mongo:8` resolves to a release that refuses to
    # start on Linux kernels 6.19+: MongoDB 8.0.21-8.0.29 and 8.3.0-8.3.8 exit
    # during startup with `MongoDB cannot start: Linux kernel versions 6.19 and
    # newer has a known incompatibility` (SERVER-121912 - tcmalloc violates the
    # rseq ABI). A floating tag is how a stack that worked one week stopped
    # booting the next without a single line changing here.
    #
    # 8.2.11 is outside that range and verified to start and stay up on kernel
    # 7.0.14. Revisit when 8.0.30 / 8.3.9 publish, which carry the real fix.
    #
    # An installation already running 8.3 with its feature compatibility
    # version raised to 8.3 will not open its data files under this pin and
    # must set that version back before upgrading.
    image: docker.io/mongo:8.2.11
    container_name: db_kodus_mongodb
    ports:
      - "27017"
    volumes:
      - mongodbdata:/data/db
    environment:
      # These variables must be defined in the .env file
      MONGO_INITDB_ROOT_USERNAME: ${API_MG_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${API_MG_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${API_MG_DB_DATABASE}
    networks:
      - kodus-backend-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin | grep -q 1",
        ]
      # `start_period` absorbs a slow first boot (a fresh volume has to create
      # the root user before it answers); failures inside it do not consume a
      # retry. `retries` absorbs flakiness, which a database does not have: it
      # is either serving or dead. Neither database declares a restart policy,
      # so a mongod that exits is reported to the dependent service in about a
      # second; this ladder only bounds how long a database that is merely slow
      # gets to become ready.
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  log_volume:
  rabbitmq-data-prod:
    name: rabbitmq-data-prod
  pgdata:
  mongodbdata:

networks:
  shared-network:
    external: true
  monitoring-network:
    driver: bridge
    name: monitoring-network
    external: true
  kodus-backend-services:
    driver: bridge
    name: kodus-backend-services
    external: true
