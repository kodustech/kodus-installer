services:
  kodus-web:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-web:${IMAGE_TAG:-latest}
    container_name: kodus-web-prod
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    environment:
      - NODE_ENV=production
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env

  api:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-api:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: ${GLOBAL_API_CONTAINER_NAME:-kodus-api}
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    ports:
      - "3001:3001"
    environment:
      - ENV=production
      - NODE_ENV=production
      # Self-hosted defaults off because this exporter persists logs and
      # telemetry in MongoDB. Operators can opt in explicitly from .env.
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-worker:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-worker-prod
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    environment:
      - ENV=production
      - NODE_ENV=production
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
      # Only `api` runs DB migrations on boot — it runs the OLTP *and* the
      # analytics-warehouse migrations from the shared prod-entrypoint. If
      # worker/webhooks/worker-analytics also migrated concurrently they would
      # race on CREATE TYPE (duplicate key pg_type_typname_nsp_index) and
      # crash-loop the first boot. Override the .env default to false here.
      - RUN_MIGRATIONS=false
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Analytics ingestion worker (Enterprise / Cockpit). Same image as `worker`,
  # only WORKER_ROLE differs: this process runs the cockpit warehouse ingestion
  # + PR classifier crons and writes the `analytics` Postgres schema. The main
  # `worker` stays role=code-review and never touches analytics.
  #
  # Opt-in: gated behind the `analytics` compose profile so community installs
  # don't pay for an idle worker. Enable with `COMPOSE_PROFILES=analytics`
  # (and set the ANALYTICS_* block in .env). See docs → Analytics Worker.
  worker-analytics:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-worker:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-worker-analytics
    profiles:
      - analytics
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    environment:
      - ENV=production
      - NODE_ENV=production
      - WORKER_ROLE=analytics
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
      # Migrations belong to `api` only — see the note on the `worker` service.
      - RUN_MIGRATIONS=false
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  webhooks:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-ai-webhook:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-webhooks-prod
    volumes:
      - log_volume:/app/logs
    logging:
      options:
        max-size: "200m"
        max-file: "10"
    ports:
      - "${API_WEBHOOKS_PORT:-3332}:${API_WEBHOOKS_PORT:-3332}"
    environment:
      - ENV=production
      - NODE_ENV=production
      - API_WEBHOOKS_PORT=${API_WEBHOOKS_PORT:-3332}
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
      # Migrations belong to `api` only — see the note on the `worker` service.
      - RUN_MIGRATIONS=false
    networks:
      - shared-network
      - kodus-backend-services
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
      db_kodus_mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kodus-mcp-manager:
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-mcp-manager:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: kodus-mcp-manager
    ports:
      - "${API_MCP_MANAGER_PORT:-3101}:${API_MCP_MANAGER_PORT:-3101}"
    environment:
      - NODE_ENV=${API_MCP_MANAGER_NODE_ENV:-production}
      - API_MCP_MANAGER_NODE_ENV=${API_MCP_MANAGER_NODE_ENV:-production}
      - OBSERVABILITY_MONGO_ENABLED=${OBSERVABILITY_MONGO_ENABLED:-false}
    env_file:
      - .env
    # It creates its schema on boot and exits if the database is not there yet.
    # Not on the optional pooler: `required: false` needs Compose 2.20+, and
    # install.sh also accepts older docker-compose. The pooler waits for the
    # same Postgres, so both come up together.
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
    networks:
      - kodus-backend-services
      - shared-network
    restart: unless-stopped

  rabbitmq:
    # Pre-built image bundling the rabbitmq_delayed_message_exchange plugin
    # (required by Kodus workflow delayed retries — see kodus-ai issue #873).
    # Published by kodus-ai .github/workflows/rabbitmq-build-push.yml: base
    # digest-pinned, plugin/rabbitmqadmin SHA256-verified, Trivy-scanned, and
    # it provisions both the kodus-ai and kodus-ast vhosts. Pinned to a fixed
    # tag rather than :latest because this image tracks the RabbitMQ + plugin
    # version, not the Kodus release. A change to the image (including its
    # rabbitmq.conf) ships under a new tag (-kodus.N) bumped here: `up` only
    # pulls a tag it does not have, so a republished tag never reaches an
    # existing install. The local docker/rabbitmq/ build context is kept as a
    # fallback but is no longer used.
    image: ${KODUS_REGISTRY:-ghcr.io/kodustech}/kodus-rabbitmq:4.2.2-kodus.1
    container_name: rabbitmq-prod
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    ports:
      - "5672"
      - "15672"
      - "15692:15692"
    networks:
      - monitoring-network
      - shared-network
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-kodus}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-kodus}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit heartbeat 60
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - rabbitmq-data-prod:/var/lib/rabbitmq
    command: /usr/local/bin/init-definitions.sh
    restart: unless-stopped

  db_kodus_postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: db_kodus_postgres
    # Like every other service: a host reboot (kernel update, power loss, cloud
    # maintenance) must bring the databases back, or the API and the workers
    # come up without them and Kodus stays down until someone starts them.
    restart: unless-stopped
    ports:
      - "5432"
    environment:
      POSTGRES_USER: ${API_PG_DB_USERNAME}
      POSTGRES_PASSWORD: ${API_PG_DB_PASSWORD}
      POSTGRES_DB: ${API_PG_DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - kodus-backend-services
    healthcheck:
      test:
        # -h 127.0.0.1 forces TCP. On a fresh volume the entrypoint first runs
        # a temporary server on the Unix socket only (listen_addresses='') to
        # create the role and run docker-entrypoint-initdb.d; a socket probe
        # would call that one ready and release the app before init.sql ran.
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${API_PG_DB_USERNAME} -d ${API_PG_DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Optional PgBouncer in transaction mode in front of db_kodus_postgres, as a
  # reference for installs that pool connections. Enable with
  # `COMPOSE_PROFILES=pgbouncer` and point the app at it in .env:
  #   API_PG_DB_HOST=db_kodus_pgbouncer
  #   API_PG_DB_DIRECT_HOST=db_kodus_postgres   # migrations + live events
  # The image has no env for track_extra_parameters, which Kodus needs (it
  # sends statement_timeout and idle_in_transaction_session_timeout when it
  # connects): its entrypoint writes the ini, the line is appended, then
  # pgbouncer starts. See docs/compose.md → PostgreSQL behind a pooler.
  db_kodus_pgbouncer:
    image: docker.io/edoburu/pgbouncer:v1.26.1-p0
    container_name: db_kodus_pgbouncer
    profiles:
      - pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: db_kodus_postgres
      DB_PORT: "5432"
      DB_USER: ${API_PG_DB_USERNAME}
      DB_PASSWORD: ${API_PG_DB_PASSWORD}
      DB_NAME: ${API_PG_DB_DATABASE}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "40"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        /entrypoint.sh true &&
        echo 'track_extra_parameters = statement_timeout,idle_in_transaction_session_timeout' >> /etc/pgbouncer/pgbouncer.ini &&
        exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    depends_on:
      db_kodus_postgres:
        condition: service_healthy
    networks:
      - kodus-backend-services
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 5

  db_kodus_mongodb:
    # Pinned, never floating: `mongo:8` moved under existing installs and is how
    # a stack that worked one week stopped booting the next.
    #
    # 8.3.13 is what `mongo:8` resolves to today, so an install that ran the
    # floating tag keeps opening its data (a file written by 8.3 cannot be opened
    # by 8.2). But no 8.3 release starts on Linux kernels 6.19+ (SERVER-121912);
    # there `scripts/install.sh` sets KODUS_MONGO_IMAGE to 8.2.11, which does.
    # Such hosts never ran 8.3, so they have no 8.3 data to lose.
    image: ${KODUS_MONGO_IMAGE:-docker.io/mongo:8.3.13}
    container_name: db_kodus_mongodb
    restart: unless-stopped
    ports:
      - "27017"
    volumes:
      - mongodbdata:/data/db
    environment:
      # These variables must be defined in the .env file
      MONGO_INITDB_ROOT_USERNAME: ${API_MG_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${API_MG_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${API_MG_DB_DATABASE}
    networks:
      - kodus-backend-services
    healthcheck:
      test:
        [
          "CMD-SHELL",
          # Credentials go as quoted flags, not inside a URI: a password with
          # @ : / % # or a space would break the URI and keep the container
          # unhealthy forever, which now blocks the whole stack.
          "mongosh --quiet --host 127.0.0.1 -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1",
        ]
      # `start_period` absorbs a slow first boot (a fresh volume has to create
      # the root user before it answers); failures inside it do not consume a
      # retry. `retries` absorbs flakiness, which a database does not have: it
      # is either serving or dead. A mongod that exits is restarted (restart:
      # unless-stopped, so a reboot brings it back), and while it is down the
      # dependent services see it unhealthy; this ladder only bounds how long a
      # database that is merely slow gets to become ready.
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  log_volume:
  rabbitmq-data-prod:
    name: rabbitmq-data-prod
  pgdata:
  mongodbdata:

networks:
  shared-network:
    external: true
  monitoring-network:
    driver: bridge
    name: monitoring-network
    external: true
  kodus-backend-services:
    driver: bridge
    name: kodus-backend-services
    external: true
