suite: Additional container environment
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
  - templates/migration-job.yaml
  - templates/datastores/bundled-postgres.yaml
  - templates/datastores/bundled-mongodb.yaml
  - templates/datastores/bundled-rabbitmq.yaml
release:
  name: kodus
tests:
  - it: supports env values and references in services.api
    set:
      services.api.extraEnv: [{"name":"EXTRA_LITERAL","value":"{{ literal }}"},{"name":"EXTRA_SECRET","valueFrom":{"secretKeyRef":{"name":"custom-secret","key":"token"}}},{"name":"EXTRA_FIELD","valueFrom":{"fieldRef":{"fieldPath":"metadata.name"}}}]
      services.api.extraEnvFrom: [{"configMapRef":{"name":"custom-config"}},{"prefix":"CUSTOM_","secretRef":{"name":"custom-secret","optional":true}}]
    documentSelector:
      path: metadata.name
      value: kodus-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {"name":"EXTRA_LITERAL","value":"{{ literal }}"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {"name":"EXTRA_SECRET","valueFrom":{"secretKeyRef":{"name":"custom-secret","key":"token"}}}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {"name":"EXTRA_FIELD","valueFrom":{"fieldRef":{"fieldPath":"metadata.name"}}}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {"name":"API_PG_DB_HOST","value":"kodus-postgres"}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {"configMapRef":{"name":"custom-config"}}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {"prefix":"CUSTOM_","secretRef":{"name":"custom-secret","optional":true}}
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: {configMapRef: {name: kodus-config}}
