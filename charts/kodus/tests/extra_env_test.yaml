    template: templates/datastores/bundled-mongodb.yaml
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 3
