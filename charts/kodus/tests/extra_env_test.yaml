    set:
      services.api.env.LEGACY_SETTING: legacy
      services.worker.extraEnv: [{name: WORKER_ONLY, value: enabled}]
    documentSelector:
      path: metadata.name
      value: kodus-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LEGACY_SETTING, value: legacy}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: WORKER_ONLY, value: enabled}
