suite: Pod scheduling controls
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
  - templates/migration-job.yaml
  - templates/datastores/bundled-postgres.yaml
  - templates/datastores/bundled-mongodb.yaml
  - templates/datastores/bundled-rabbitmq.yaml
release:
  name: kodus
tests:
  - it: renders no scheduling fields by default
    templates:
      - templates/deployment.yaml
      - templates/migration-job.yaml
      - templates/datastores/bundled-postgres.yaml
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: applies top-level values to every Deployment
    template: templates/deployment.yaml
    set:
      nodeSelector: {agentpool: kodus}
      tolerations: [{key: dedicated, operator: Equal, value: kodus, effect: NoSchedule}]
      affinity: {nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: kubernetes.io/arch, operator: In, values: [amd64]}]}]}}}
      topologySpreadConstraints: [{maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, matchLabelKeys: [app.kubernetes.io/name]}]
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {agentpool: kodus}
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: dedicated, operator: Equal, value: kodus, effect: NoSchedule}]
      - exists:
          path: spec.template.spec.affinity.nodeAffinity
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].matchLabelKeys
          value: [app.kubernetes.io/name]

  - it: applies top-level values to the migration Job
    template: templates/migration-job.yaml
    set:
      nodeSelector: {agentpool: kodus}
      tolerations: [{key: dedicated, operator: Equal, value: kodus, effect: NoSchedule}]
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {agentpool: kodus}
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: dedicated, operator: Equal, value: kodus, effect: NoSchedule}]

  - it: applies top-level values to a bundled StatefulSet
    template: templates/datastores/bundled-postgres.yaml
    set:
      nodeSelector: {agentpool: kodus}
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {agentpool: kodus}

  - it: per-service value replaces the top-level one (no merge)
    template: templates/deployment.yaml
    set:
      # Disjoint keys: a merge would leave disktype on the override.
      nodeSelector: {agentpool: kodus, disktype: ssd}
      tolerations: [{key: dedicated, operator: Equal, value: kodus, effect: NoSchedule}]
      services.worker.nodeSelector: {agentpool: workers}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {agentpool: workers}
        documentSelector:
          path: metadata.name
          value: kodus-worker
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: dedicated, operator: Equal, value: kodus, effect: NoSchedule}]
        documentSelector:
          path: metadata.name
          value: kodus-worker
      - equal:
          path: spec.template.spec.nodeSelector
          value: {agentpool: kodus, disktype: ssd}
        documentSelector:
          path: metadata.name
          value: kodus-api

  - it: per-store and migrations overrides replace the top-level one
    templates:
      - templates/migration-job.yaml
      - templates/datastores/bundled-mongodb.yaml
    set:
      nodeSelector: {agentpool: kodus, disktype: ssd}
      migrations.nodeSelector: {agentpool: jobs}
      mongodb.bundled.nodeSelector: {agentpool: stateful}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {agentpool: jobs}
        template: templates/migration-job.yaml
      - equal:
          path: spec.template.spec.nodeSelector
          value: {agentpool: stateful}
        template: templates/datastores/bundled-mongodb.yaml
        documentSelector:
          path: kind
          value: StatefulSet
