suite: externalsecret
templates:
  - templates/externalsecret.yaml
set:
  global.externalSecrets.enabled: true
  global.externalSecrets.store: vault
tests:
  # External Secrets fails the whole sync when one listed key is missing from
  # the store, so the GitHub App keys must not be asked for by default.
  - it: does not fetch the GitHub App keys by default
    asserts:
      - notContains:
          path: spec.data
          content:
            secretKey: API_GITHUB_PRIVATE_KEY
            remoteRef:
              key: kodus/API_GITHUB_PRIVATE_KEY
      - notContains:
          path: spec.data
          content:
            secretKey: API_GITHUB_CLIENT_SECRET
            remoteRef:
              key: kodus/API_GITHUB_CLIENT_SECRET
      - contains:
          path: spec.data
          content:
            secretKey: API_JWT_SECRET
            remoteRef:
              key: kodus/API_JWT_SECRET

  - it: fetches the GitHub App keys when githubApp is on
    set:
      global.externalSecrets.githubApp: true
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: API_GITHUB_PRIVATE_KEY
            remoteRef:
              key: kodus/API_GITHUB_PRIVATE_KEY
      - contains:
          path: spec.data
          content:
            secretKey: API_GITHUB_CLIENT_SECRET
            remoteRef:
              key: kodus/API_GITHUB_CLIENT_SECRET
      - contains:
          path: spec.data
          content:
            secretKey: API_JWT_SECRET
            remoteRef:
              key: kodus/API_JWT_SECRET
