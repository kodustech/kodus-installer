{{- if .Values.pdb.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if or (kindIs "invalid" $svc.enabled) $svc.enabled }}
{{- /*
  Effective replica floor — mirrors whichever controller actually drives the
  count: the HPA's minReplicas when autoscaling is on, the Deployment's replicas
  when it isn't. Must stay in step with hpa.yaml and deployment.yaml.
*/}}
{{- $floor := 0 }}
{{- if $.Values.autoscaling.enabled }}
{{- $floor = $svc.replicas | default $.Values.autoscaling.minReplicas | default 2 | int }}
{{- else }}
{{- $floor = $svc.replicas | default 1 | int }}
{{- end }}
{{- /*
  Skip single-replica services. `minAvailable: 1` against a floor of 1 yields
  disruptionsAllowed = 1 - 1 = 0, which does not merely slow evictions down — it
  forbids them outright and forever. `oc adm drain` then hangs on that pod, and
  the error names the pod rather than the PDB, so node maintenance and cluster
  upgrades stall on what looks like an application problem. A PDB that blocks
  every eviction is worse than no PDB: it trades seconds of downtime for a
  cluster that can no longer be maintained. mcp-manager and worker-analytics both
  run at replicas 1 by default and hit exactly this.
*/}}
{{- if gt $floor 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kodus-common.serviceFullname" (dict "root" $ "serviceName" $name) }}
  labels:
    {{- include "kodus-common.serviceLabels" (dict "root" $ "serviceName" $name) | nindent 4 }}
spec:
  {{- /* Raising this to the replica floor recreates the deadlock described above. */}}
  minAvailable: {{ $.Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "kodus-common.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
