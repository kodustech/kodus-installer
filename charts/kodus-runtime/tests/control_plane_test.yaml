suite: Control plane
values:
  - values/ci.yaml
release:
  name: kr
  namespace: kodus
tests:
  - it: keeps the state and PKI on uninstall while the data stays
    templates: [templates/control-plane/secrets.yaml]
    asserts:
      - equal: { path: "metadata.annotations[\"helm.sh/resource-policy\"]", value: keep }
        documentIndex: 0
      - equal: { path: "metadata.annotations[\"helm.sh/resource-policy\"]", value: keep }
        documentIndex: 1
  - it: leaves nothing when the data goes with the release
    templates:
      - templates/control-plane/secrets.yaml
      - templates/control-plane/jobs.yaml
    set:
      controlPlane.purgeDataOnUninstall: true
    asserts:
      - notExists: { path: metadata.annotations }
        template: templates/control-plane/secrets.yaml
        documentIndex: 0
      - equal: { path: "metadata.annotations[\"helm.sh/hook\"]", value: pre-delete }
        template: templates/control-plane/jobs.yaml
        documentSelector: { path: metadata.name, value: kr-kodus-runtime-db-purge }
  - it: gives the hub only the database, the broker and the secrets reader
    templates: [templates/control-plane/hub-worker.yaml]
    documentIndex: 0
    asserts:
      - isKind: { of: Deployment }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RUNTIME_SECRET_SEAL_KEY, valueFrom: { secretKeyRef: { name: kr-kodus-runtime-env, key: RUNTIME_SECRET_SEAL_KEY } } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: RUNTIME_TLS_WORKER_CA, value: /runtime/pki/worker-ca.pem }
  - it: lets only the runtime-worker reach the hub's internal listener
    templates: [templates/control-plane/networkpolicy.yaml]
    asserts:
      - equal:
          path: spec.ingress[1]
          value:
            from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: kodus-runtime, app.kubernetes.io/instance: kr, app.kubernetes.io/component: worker } } }]
            ports: [{ protocol: TCP, port: 3411 }]
        documentIndex: 0
  - it: requires the release version DBOS resumes workflows by
    templates: [templates/control-plane/hub-worker.yaml]
    set:
      controlPlane.releaseVersion: ""
    asserts:
      - failedTemplate:
          errorPattern: "controlPlane.releaseVersion is required"
  - it: runs OpenBao without IPC_LOCK, restricted
    templates: [templates/control-plane/openbao.yaml]
    documentSelector: { path: kind, value: Deployment }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: ["ALL"] } }
  - it: issues the worker's certificate with OU=worker in its pod, the subject the hub's internal routes require
    templates: [templates/control-plane/hub-worker.yaml]
    documentIndex: 4
    asserts:
      - isKind: { of: Deployment }
      - equal: { path: "spec.template.spec.initContainers[1].name", value: worker-cert }
      - contains: { path: "spec.template.spec.initContainers[1].command", content: "-ou" }
      - contains: { path: "spec.template.spec.initContainers[1].command", content: worker }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: RUNTIME_WORKER_TLS_CERT, value: /runtime/worker-tls/worker.pem }
  - it: gives the worker a fixed DBOS executor id, which the production image refuses to start without
    templates: [templates/control-plane/hub-worker.yaml]
    documentIndex: 4
    asserts:
      - isKind: { of: Deployment }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: RUNTIME_EXECUTOR_ID, value: kr-kodus-runtime-worker-1 }
  - it: puts the listed organizations on the alpha track with a Job per release
    templates: [templates/control-plane/jobs.yaml]
    release: { revision: 1 }
    set:
      controlPlane.alphaOrganizations: [7e1f16b2-64fa-4b67-919f-aeed90bd8961, all]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: RUNTIME_INIT_MODE, value: release-track }
        documentSelector: { path: metadata.name, value: kr-kodus-runtime-release-track-1 }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: RUNTIME_ORGS, value: 7e1f16b2-64fa-4b67-919f-aeed90bd8961 all }
        documentSelector: { path: metadata.name, value: kr-kodus-runtime-release-track-1 }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: RUNTIME_INIT_TRACK, value: alpha }
        documentSelector: { path: metadata.name, value: kr-kodus-runtime-release-track-1 }
  - it: renders no release-track Job by default
    templates: [templates/control-plane/jobs.yaml]
    asserts:
      - hasDocuments: { count: 5 }
  - it: adds exactly the release-track Job when organizations are listed
    templates: [templates/control-plane/jobs.yaml]
    set:
      controlPlane.alphaOrganizations: [all]
    asserts:
      - hasDocuments: { count: 6 }
  - it: refuses an entry that is neither an organization id nor all
    templates: [templates/control-plane/jobs.yaml]
    set:
      controlPlane.alphaOrganizations: ["x' OR true"]
    asserts:
      - failedTemplate: { errorPattern: "is neither an organization id nor all" }
