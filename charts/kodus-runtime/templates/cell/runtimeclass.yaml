{{- if .Values.cell.enabled }}
{{- $rc := .Values.cell.runtimeClass }}
{{- if $rc.create }}
# The isolated RuntimeClass, for a cluster whose nodes have the handler
# registered with containerd (gVisor: runsc, with containerd-shim-runsc-v1)
# and no class yet. Managed classes (GKE Sandbox, kata-deploy) exist already:
# leave create false and name theirs.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $rc.name }}
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "cell") | nindent 4 }}
handler: {{ $rc.handler }}
{{- if or $rc.nodeSelector $rc.tolerations }}
scheduling:
  {{- with $rc.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $rc.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- else if lookup "v1" "Namespace" "" "kube-system" }}
{{- /* A live cluster (install, upgrade, a server dry run); helm template has none and skips this. */}}
{{- if not (lookup "node.k8s.io/v1" "RuntimeClass" "" $rc.name) }}
{{- fail (printf "cell.runtimeClass.name: the RuntimeClass %q does not exist in this cluster. Claim pods run only on an isolated runtime: install gVisor (runsc, with gvisor-bin/ next to it, and containerd-shim-runsc-v1 registered with containerd as the handler %q) or Kata Containers on the nodes, then create the class (cell.runtimeClass.create=true) or name the one your platform made (GKE Sandbox: gvisor)." $rc.name $rc.handler) }}
{{- end }}
{{- end }}
{{- end }}
