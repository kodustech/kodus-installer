{{- $c := .Values.cell }}
{{- if and $c.enabled $c.environments.enabled }}
{{- $env := $c.environments.namespace }}
{{- if or (eq $env $c.namespace) (eq $env $c.sandboxNamespace) }}
{{- fail "cell.environments.namespace must differ from cell.namespace and cell.sandboxNamespace" }}
{{- end }}
{{- $classes := $c.environments.runtimeClasses | default (list $c.runtimeClass.name) }}
# The cell's environment namespace (environment Runs), rendered from kodus-ai
# apps/runtime-cell/deploy/kubernetes/environment-namespace.yaml (generated by
# internal/drivers/k8ssandbox EnvironmentNamespace): Pod Security privileged,
# the admission gate, default deny, the cell's Role, plus the bindings to this
# chart's cell and reaper service accounts and the reaper's Role there.
# Off by default: the cell does not run environment Runs yet.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $env }}
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "environments") | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kr.fullname" . }}-environment-gate
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "environments") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName in [{{ range $i, $n := $classes }}{{ if $i }}, {{ end }}'{{ $n }}'{{ end }}]"
      message: "an environment pod runs on one of the RuntimeClasses {{ join ", " $classes }}"
      reason: Forbidden
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: an environment pod mounts no hostPath
      reason: Forbidden
    - expression: "!(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC)"
      message: an environment pod shares no host namespace (hostNetwork, hostPID, hostIPC)
      reason: Forbidden
    - expression: "object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)) && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))) && (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)))"
      message: an environment pod opens no host port
      reason: Forbidden
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false && (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.serviceAccountToken))))"
      message: "an environment pod carries no service account token (automountServiceAccountToken: false, no projected token)"
      reason: Forbidden
    - expression: "(has(object.spec.runtimeClassName) && object.spec.runtimeClassName.startsWith('kata')) || (object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false) && (!has(object.spec.initContainers) || object.spec.initContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)) && (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)))"
      message: an environment pod is privileged only on a kata RuntimeClass
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kr.fullname" . }}-environment-gate
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "environments") | nindent 4 }}
spec:
  policyName: {{ include "kr.fullname" . }}-environment-gate
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: {{ $env }} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $env }}
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "environments") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kr.cell" . }}-environments
  namespace: {{ $env }}
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "environments") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kr.cell" . }}-environments
  namespace: {{ $env }}
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "environments") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kr.cell" . }}-environments
subjects:
  - kind: ServiceAccount
    name: {{ include "kr.cell" . }}
    namespace: {{ $c.namespace }}
---
# The reaper's -k8s-env-namespace (kodus-ai cmd/reaper): a reaped machine's
# pods, volume claims and policy there go with it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kr.cell" . }}-reaper-environments
  namespace: {{ $env }}
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "reaper") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kr.cell" . }}-reaper-environments
  namespace: {{ $env }}
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "reaper") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kr.cell" . }}-reaper-environments
subjects:
  - kind: ServiceAccount
    name: {{ include "kr.cell" . }}-reaper
    namespace: {{ $c.namespace }}
{{- end }}
