{{- if .Values.controlPlane.enabled }}
{{- $s := dict "root" $ }}
{{- $pg := include "kr.pgHost" . }}
# Generated once and kept across upgrades (kr.state): the Runtime's database
# and broker passwords, the sealing and signing keys, OpenBao's unseal key and
# AppRole ids. The unseal key opens every org secret: back it up apart from
# the database (docs/runtime.md, "Backup").
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kr.fullname" . }}-state
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "state") | nindent 4 }}
  {{- if not .Values.controlPlane.purgeDataOnUninstall }}
  # Kept on uninstall while the data is: without this key and CA the
  # Runtime database and the vault cannot be read or reached again.
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range $k := list "pgRuntime" "pgReader" "pgSecretsReader" "pgOpenbao" "mqRuntime" "runToken" "evidenceSecret" "sealKey" "apiRoleId" "apiSecretId" "injectorRoleId" "injectorSecretId" }}
  {{ $k }}: {{ include "kr.get" (dict "root" $ "key" $k) | b64enc }}
  {{- end }}
  unsealKey: {{ include "kr.get" (dict "root" $ "key" "unsealKey") }}
---
# The Runtime CA (signs the hub's certificate and every cell's), the worker's
# own CA, and OpenBao's: P-256, generated once.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kr.fullname" . }}-pki
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "pki") | nindent 4 }}
  {{- if not .Values.controlPlane.purgeDataOnUninstall }}
  # Kept on uninstall while the data is: without this key and CA the
  # Runtime database and the vault cannot be read or reached again.
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range $k := list "ca.pem" "ca.key" "hub.pem" "hub.key" "worker-ca.pem" "worker-ca.key" "openbao-ca.pem" "openbao.pem" "openbao.key" }}
  {{ $k }}: {{ include "kr.pki" (dict "root" $ "key" $k) | b64enc }}
  {{- end }}
---
# What the hub, the runtime-worker and the jobs read as environment.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kr.fullname" . }}-env
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "env") | nindent 4 }}
type: Opaque
stringData:
  RUNTIME_DATABASE_URL: {{ include "kr.runtimeDbUrl" . | quote }}
  RUNTIME_RABBITMQ_URL: {{ include "kr.mqUrl" . | quote }}
  RUNTIME_PRODUCT_SECRETS_READ_URL: {{ printf "postgres://kodus_runtime_secrets_reader:%s@%s:%v/%s?sslmode=%s" (include "kr.get" (dict "root" $ "key" "pgSecretsReader")) $pg .Values.postgres.port .Values.postgres.productDatabase .Values.postgres.sslMode | quote }}
  RUNTIME_SECRET_SEAL_KEY: {{ include "kr.get" (dict "root" $ "key" "sealKey") | quote }}
  RUNTIME_EVIDENCE_SIGNING_SECRET: {{ include "kr.get" (dict "root" $ "key" "evidenceSecret") | quote }}
  OPENBAO_DATABASE_URL: {{ printf "postgres://openbao:%s@%s:%v/kodus_openbao?sslmode=%s" (include "kr.get" (dict "root" $ "key" "pgOpenbao")) $pg .Values.postgres.port .Values.postgres.sslMode | quote }}
  RUNTIME_PG_PASSWORD: {{ include "kr.get" (dict "root" $ "key" "pgRuntime") | quote }}
  RUNTIME_READER_PG_PASSWORD: {{ include "kr.get" (dict "root" $ "key" "pgReader") | quote }}
  RUNTIME_SECRETS_READER_PG_PASSWORD: {{ include "kr.get" (dict "root" $ "key" "pgSecretsReader") | quote }}
  RUNTIME_OPENBAO_PG_PASSWORD: {{ include "kr.get" (dict "root" $ "key" "pgOpenbao") | quote }}
  RUNTIME_MQ_PASSWORD: {{ include "kr.get" (dict "root" $ "key" "mqRuntime") | quote }}
---
# The product's side (charts/kodus services.api and services.worker
# extraEnvFrom): what scripts/runtime/generate.sh writes to product-api.env
# and product-worker.env for Compose.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kr.fullname" . }}-product
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "product") | nindent 4 }}
type: Opaque
stringData:
  RUNTIME_ENABLED: "true"
  RUNTIME_DATABASE_READ_URL: {{ printf "postgres://kodus_runtime_reader:%s@%s:%v/kodus_runtime?sslmode=%s" (include "kr.get" (dict "root" $ "key" "pgReader")) $pg .Values.postgres.port .Values.postgres.sslMode | quote }}
  RUNTIME_STREAM_STORE: postgres
  RUNTIME_RUN_TOKEN_SECRET: {{ include "kr.get" (dict "root" $ "key" "runToken") | quote }}
  RUNTIME_SECRET_SEAL_KEY: {{ include "kr.get" (dict "root" $ "key" "sealKey") | quote }}
  RUNTIME_ENV_SESSION_URL: {{ printf "http://%s:3430" (include "kr.worker" .) | quote }}
  RUNTIME_SANDBOX_URL: {{ printf "http://%s:3430" (include "kr.worker" .) | quote }}
  RUNTIME_EVIDENCE_STORE: file
  RUNTIME_EVIDENCE_BASE_URL: {{ include "kr.evidenceUrl" . | quote }}
  RUNTIME_EVIDENCE_SIGNING_SECRET: {{ include "kr.get" (dict "root" $ "key" "evidenceSecret") | quote }}
  RUNTIME_EVIDENCE_URL_TTL_SECONDS: "300"
  RUNTIME_OPENBAO_ADDR: {{ printf "https://%s:8200" (include "kr.openbao" .) | quote }}
  RUNTIME_OPENBAO_MOUNT: runtime-kv
  RUNTIME_OPENBAO_CA_FILE: /runtime/openbao/ca.pem
  RUNTIME_OPENBAO_ROLE_ID_FILE: /runtime/openbao/api-role-id
  RUNTIME_OPENBAO_SECRET_ID_FILE: /runtime/openbao/api-secret-id
  {{- if eq .Values.controlPlane.product.sandboxProvider "runtime" }}
  SANDBOX_PROVIDER: runtime
  {{- end }}
---
# Files the product API mounts at /runtime/openbao (charts/kodus
# services.api.extraVolumes): OpenBao's CA and the API's write-only AppRole.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kr.fullname" . }}-product-files
  labels:
    {{- include "kr.labels" (dict "root" $ "component" "product") | nindent 4 }}
type: Opaque
data:
  ca.pem: {{ include "kr.pki" (dict "root" $ "key" "openbao-ca.pem") | b64enc }}
  api-role-id: {{ include "kr.get" (dict "root" $ "key" "apiRoleId") | b64enc }}
  api-secret-id: {{ include "kr.get" (dict "root" $ "key" "apiSecretId") | b64enc }}
{{- end }}
