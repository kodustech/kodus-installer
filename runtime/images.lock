# Every image and kit the Kody Runtime runs, by digest, per release.
#
# Tab-separated, '#' comments. Columns:
#   release    a `product` (control plane) or `cell_release` value of
#              compatibility.tsv; `any` for pins that do not move with a release
#   component  hub | worker | openbao | cell | builder | sandbox | browser |
#              holder | helper | registry | microvm-kit
#   reference  registry/repository@sha256:<digest>, or `-` when no digest exists
#   status     published (pullable from the registry named) | unpublished
#              (the digest is known or not, but no registry holds it yet)
#
# scripts/runtime/lib.sh refuses an unpublished component unless the operator
# names a local build with KODUS_RUNTIME_<COMPONENT>_IMAGE (docs/runtime.md,
# "Images that do not exist yet"). Third-party images are upstream and
# unmodified: OpenBao (MPL-2.0, its own service), distribution registry,
# Alpine and BusyBox (run by the cell as separate containers).
#
# builder: the digest is the reproducible build the cell pins
# (apps/runtime-cell/cmd/cell/config.go defaultBuilderImage); the first cell
# release pushes it to GHCR, so until then no registry has it.
# holder: which image serves as the docker-gvisor holder is not decided
# upstream (cell-distribution.md item 4); the dev cell runs alpine:3.20.
# microvm-kit: only for the firecracker backend (phase P2); not built.
#release	component	reference	status
unreleased	hub	-	unpublished
unreleased	worker	-	unpublished
unreleased	cell	-	unpublished
