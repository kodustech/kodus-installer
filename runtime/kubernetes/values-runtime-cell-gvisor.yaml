# Values for kodus-ai apps/runtime-cell/deploy/chart/runtime-cell with a gVisor
# RuntimeClass. That chart is a skeleton: it renders the reaper CronJob, the
# RuntimeClass, an admission policy and RBAC, and deploys no cell (the
# k8s-sandbox driver is not selectable by cmd/cell yet). These values are for
# when it does; until then a Kubernetes customer runs cells on a Docker host
# (profile docker-gvisor). Images by digest only (runtime/images.lock).
cellId: ""
runtimeClass:
  # GKE Sandbox: gvisor (the chart then must not create its own; see docs/runtime.md).
  name: gvisor
  handler: runsc
images:
  cell: ""      # ghcr.io/kodustech/kodus-runtime-cell@sha256:<digest> (not published yet)
  holder: "docker.io/library/alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"
  observer: ""  # not decided upstream (cell-distribution.md item 4)
namespaces:
  cell: kodus-cell
  egress: kodus-egress
reaper:
  schedule: "* * * * *"
