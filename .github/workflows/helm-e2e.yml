name: Helm chart E2E (kind)

# helm-ci.yml validates that the chart RENDERS. This one validates that it
# RUNS: a real single-node Kubernetes cluster, a real install, real images,
# real rollout, then the doctor and the chart's own `helm test` hooks.
#
# Both bugs this chart shipped were of the kind only an install can catch — a
# PodDisruptionBudget that forbids every eviction, and a liveness probe on "/"
# that tied pod health to server-rendering a whole React page. Each rendered
# flawless YAML and passed lint and kubeconform.
#
# Two scenarios run in parallel, because they fail differently:
#   fresh   — install this branch on an empty cluster (does it work at all?)
#   upgrade — install the base branch FIRST, then upgrade to this one. Several
#             fields are immutable once created (StatefulSet.spec.serviceName,
#             Service.clusterIP, Deployment.spec.selector), so a change can
#             install perfectly and still break `helm upgrade` for every
#             existing user. A fresh install can never show that.
#
# What this does NOT cover, so nobody reads a green check as more than it is:
#   - NetworkPolicy. kind's default CNI does not enforce it, and values-dev.yaml
#     disables it anyway. The policies render and validate; nothing here proves
#     they allow or block a single packet.
#   - OpenShift. Routes and SCCs have no equivalent on kind — helm-ci.yml renders
#     them, but only a real cluster exercises them.
#   - External and operator datastore modes. Only `bundled` runs here.

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'scripts/test-kind.sh'
      - 'scripts/doctor-k8s.sh'
      - '.github/workflows/helm-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight — an E2E is far too expensive to leave
# queued runs finishing against stale commits.
concurrency:
  group: helm-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Generous enough for image pulls on a cold runner, tight enough that a hung
    # rollout fails instead of burning an hour.
    timeout-minutes: 45
    strategy:
      fail-fast: false          # an upgrade break and an install break are separate signals
      matrix:
        scenario: [fresh, upgrade]
    steps:
      # Pinned by commit SHA — a tag can be repointed at new code by anyone
      # who can push to the action's repo, and it would run with this job's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade scenario builds a git worktree at the base commit, so the
          # history has to be there.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          # The script creates and tears down its own cluster, exactly as it does
          # on a developer's machine — keep the two paths identical.
          install_only: true

      # On a PR this is the merge base; on a push to main, the previous commit.
      # Either way it is "what users already have installed".
      - name: Resolve the upgrade baseline
        if: matrix.scenario == 'upgrade'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE=$(git rev-parse HEAD~1)
          echo "BASELINE=$BASE" >> "$GITHUB_ENV"
          echo "baseline: $BASE"

      - name: Fresh install
        if: matrix.scenario == 'fresh'
        run: ./scripts/test-kind.sh --strict --keep --timeout 15m

      - name: Install baseline, then upgrade to this branch
        if: matrix.scenario == 'upgrade'
        run: ./scripts/test-kind.sh --strict --keep --timeout 15m --upgrade-from "$BASELINE"

      # The script already prints diagnostics on failure, but the run log is
      # gone the moment someone re-runs the job. Keep the evidence.
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/e2e
          kubectl get all -n kodus -o wide            > /tmp/e2e/resources.txt 2>&1 || true
          kubectl get events -n kodus --sort-by=.lastTimestamp > /tmp/e2e/events.txt 2>&1 || true
          kubectl describe pods -n kodus              > /tmp/e2e/describe-pods.txt 2>&1 || true
          helm get manifest kodus -n kodus            > /tmp/e2e/manifest.yaml 2>&1 || true
          helm history kodus -n kodus                 > /tmp/e2e/history.txt 2>&1 || true
          for p in $(kubectl get pods -n kodus -o name 2>/dev/null); do
            n=$(basename "$p")
            kubectl logs "$p" -n kodus --all-containers --tail 400 > "/tmp/e2e/logs-$n.txt" 2>&1 || true
            kubectl logs "$p" -n kodus --all-containers --previous --tail 400 > "/tmp/e2e/logs-$n-previous.txt" 2>&1 || true
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.scenario }}
          path: /tmp/e2e
          retention-days: 7

      - name: Tear down
        if: always()
        run: ./scripts/test-kind.sh --cleanup || true
