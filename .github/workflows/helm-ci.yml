name: Helm charts CI

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm-ci.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo to lint/render
# the charts. Set at the top level so every job inherits it.
permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag is a moving pointer,
      # and anyone able to push to the action's repo can repoint it at code that
      # then runs with this job's token. The trailing comment is the human-readable
      # version — keep both in step when bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Build chart dependencies
        run: helm dependency build charts/kodus

      - name: Lint (Kubernetes)
        run: helm lint charts/kodus -f charts/kodus/values-dev.yaml

      - name: Lint (OpenShift)
        run: helm lint charts/kodus -f charts/kodus/values-dev.yaml -f charts/kodus/values-openshift.yaml

      # lint and kubeconform both validate FORM — is this a well-formed chart,
      # is each rendered object valid against the Kubernetes API schema. Neither
      # can validate INTENT. A PodDisruptionBudget with minAvailable equal to the
      # replica count is flawless YAML and a flawless PDB object; it just happens
      # to forbid every eviction and hang `kubectl drain` forever. That shipped
      # through this pipeline. These tests assert properties of the rendered
      # output, which is the only layer that catches it.
      - name: Unit tests (rendered-output assertions)
        run: |
          # Pinned: an unpinned install tracks the plugin's default branch, so CI
          # is neither reproducible nor protected against an upstream change
          # landing straight in every PR run. Bump deliberately.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version v1.1.2 --verify=false
          helm unittest charts/kodus

      - name: Anti-drift — chart matches the generated schema manifest
        run: ./scripts/validate-chart-schema.sh

      - name: Reject invalid values (schema smoke test)
        run: |
          if helm template kodus charts/kodus -f charts/kodus/values-dev.yaml \
              --set postgres.mode=nope >/dev/null 2>&1; then
            echo "values.schema.json failed to reject an invalid postgres.mode"; exit 1
          fi
          echo "schema correctly rejects invalid values"

      # Downloaded from a release URL, so the checksum is verified against the
      # release's own CHECKSUMS file before the binary is ever executed — a
      # replaced asset fails here instead of silently validating our manifests.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_ASSET: kubeconform-linux-amd64.tar.gz
        run: |
          BASE="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSLo "/tmp/${KUBECONFORM_ASSET}" "${BASE}/${KUBECONFORM_ASSET}"
          curl -sSLo /tmp/CHECKSUMS "${BASE}/CHECKSUMS"
          ( cd /tmp && grep " ${KUBECONFORM_ASSET}\$" CHECKSUMS | sha256sum -c - )
          tar -xzf "/tmp/${KUBECONFORM_ASSET}" -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/
          kubeconform -v

      # -ignore-missing-schemas skips CRDs the operators own (Cluster,
      # RabbitmqCluster, MongoDBCommunity) and OpenShift kinds (Route, SCC).
      - name: Validate rendered manifests (Kubernetes)
        run: |
          helm template kodus charts/kodus -f charts/kodus/values-dev.yaml \
            | kubeconform -strict -ignore-missing-schemas -summary -schema-location default

      - name: Validate rendered manifests (OpenShift)
        run: |
          helm template kodus charts/kodus \
              -f charts/kodus/values-dev.yaml -f charts/kodus/values-openshift.yaml \
            | kubeconform -strict -ignore-missing-schemas -summary -schema-location default

      - name: Validate rendered manifests (external data stores)
        run: |
          helm template kodus charts/kodus -f charts/kodus/values-dev.yaml \
              --set postgres.mode=external --set postgres.external.existingSecret=pg \
              --set postgres.external.host=pg.example \
              --set mongodb.mode=external --set mongodb.external.existingSecret=mg \
              --set mongodb.external.host=mg.example \
              --set rabbitmq.mode=external --set rabbitmq.external.existingSecret=rmq \
            | kubeconform -strict -ignore-missing-schemas -summary -schema-location default
